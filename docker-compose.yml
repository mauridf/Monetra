version: '3.8'

services:
  # =============================================
  # PostgreSQL 16
  # =============================================
  postgres:
    image: postgres:16-alpine
    container_name: monetra-postgres
    environment:
      POSTGRES_DB: monetra
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - monetra-network

  # =============================================
  # Redis 7
  # =============================================
  redis:
    image: redis:7-alpine
    container_name: monetra-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - monetra-network

  # =============================================
  # RabbitMQ 3.13
  # =============================================
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: monetra-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - monetra-network

  # =============================================
  # MinIO (S3-compatible Storage)
  # =============================================
  minio:
    image: minio/minio:latest
    container_name: monetra-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - monetra-network

  # =============================================
  # MailHog (Email para desenvolvimento)
  # =============================================
  mailhog:
    image: mailhog/mailhog:latest
    container_name: monetra-mailhog
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
    networks:
      - monetra-network

  # =============================================
  # Monetra API
  # =============================================
  api:
    build:
      context: .
      dockerfile: src/Monetra.Api/Dockerfile
    container_name: monetra-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Application__Name=Monetra
      - Application__Url=http://localhost:5000
      - Application__CorsOrigins__0=http://localhost:3000
      - Jwt__SecretKey=super-secret-key-with-at-least-512-bits-length-for-development-only
      - Jwt__Issuer=monetra-api
      - Jwt__Audience=monetra-app
      - Database__ConnectionString=Host=postgres;Port=5432;Database=monetra;Username=postgres;Password=postgres;
      - Redis__ConnectionString=redis:6379
      - RabbitMq__Host=rabbitmq
      - RabbitMq__Port=5672
      - MinIo__Endpoint=minio:9000
      - MinIo__AccessKey=minioadmin
      - MinIo__SecretKey=minioadmin
      - Smtp__Host=mailhog
      - Smtp__Port=1025
    ports:
      - "5000:8080"
    volumes:
      - api_logs:/app/logs
      - api_uploads:/app/uploads
    networks:
      - monetra-network

  # =============================================
  # Monetra Scheduler
  # =============================================
  scheduler:
    build:
      context: .
      dockerfile: src/Monetra.Scheduler/Dockerfile
    container_name: monetra-scheduler
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Database__ConnectionString=Host=postgres;Port=5432;Database=monetra;Username=postgres;Password=postgres;
      - Redis__ConnectionString=redis:6379
      - RabbitMq__Host=rabbitmq
    networks:
      - monetra-network

volumes:
  postgres_data:
  minio_data:
  api_logs:
  api_uploads:

networks:
  monetra-network:
    driver: bridge